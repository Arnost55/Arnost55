name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [portfolio]
  workflow_dispatch:

# Grant permissions required for native GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: portfolio-next/package-lock.json

      - name: Install dependencies
        working-directory: portfolio-next
        run: npm ci

      - name: Build
        working-directory: portfolio-next
        run: npm run build

      - name: Create CNAME file
        run: echo "arnost.kernelkicks.dev" > ./portfolio-next/out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./portfolio-next/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
