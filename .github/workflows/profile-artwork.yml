name: Refresh profile artwork
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate SVG from shared portfolio content
        run: node portfolio/scripts/render-profile.mjs
      - name: Validate SVG files
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for name in ('profile-dark.svg', 'profile-light.svg'):
              ET.parse(name)
              print('Validated', name)
          PY
      - name: Commit only when artwork changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-dark.svg profile-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile artwork [skip ci]"
            git push
          fi
