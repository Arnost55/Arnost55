name: Generate contribution snake

on:
  schedule:
    # Every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        id: snake-svg
        with:
          github_user_name: Arnost55
          outputs: |
            dist/snake-light.svg?color_snake=#10B981&color_dots=#2d3343,#30634d,#1b6e40,#2ea043,#3fb950
            dist/snake-dark.svg?color_snake=#22D3EE&color_dots=#2d3343,#30634d,#1b6e40,#2ea043,#3fb950

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}